# SPDX-License-Identifier: MIT
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vectors-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify test-vectors.json reproducibility & zero internal leakage
        run: |
          node _tooling/generate-vectors.mjs
          git diff --exit-code -- test-vectors.json
          ! grep -rnE '(/internal/|OPENAPI_SECRET_ENC_KEY|B2B_CREDENTIAL_ENC_KEY)' README* SIGNING* INTERFACES* test-vectors.json nodejs python php go java cpp rust

  nodejs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - working-directory: nodejs
        run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - working-directory: python
        run: python -m unittest discover -s tests -v

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json
      - working-directory: php
        run: php tests/run.php

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false
      - working-directory: go
        run: go test -v -count=1 ./...

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - working-directory: java
        run: bash run-tests.sh

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSSL & libcurl dev headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libcurl4-openssl-dev cmake g++
      - name: Build & CTest
        run: |
          cmake -S cpp -B cpp/build
          cmake --build cpp/build
          ctest --test-dir cpp/build --output-on-failure

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install libcurl dev headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: rust
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test
