[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bebebus-baccarat-openapi-sdk"
version = "1.5.3"
description = "Zero-dependency Python 3 SDK for Baccarat Live Platform B2B Operator Seamless Wallet API (v1.5.3)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["baccarat_sdk*"]

[tool.setuptools.package-data]
baccarat_sdk = ["py.typed"]
